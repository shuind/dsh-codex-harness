- insert:
    # Keep preset installation and settings registration on the host plane.
    - id: codex-preset-installer
      name: '@shuind/dsh-codex-harness/installer'
    # This row owns the global capability layer and also advertises the
    # browser face. Codex prompt/tools remain agent-preset scoped.
    - id: codex-client
      name: '@shuind/dsh-codex-harness'
      config:
        globalEnhancements: true
        codexCore: false
